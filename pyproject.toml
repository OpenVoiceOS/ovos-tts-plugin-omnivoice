[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-tts-plugin-omnivoice"
dynamic = ["version"]
description = "OmniVoice massively-multilingual zero-shot TTS plugin for OpenVoiceOS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
keywords = ["ovos", "plugin", "tts", "omnivoice", "arabic", "multilingual"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-utils>=0.3.0,<1.0.0",
    "soundfile",
    # The OmniVoice runtime — required to synthesize. torch/torchaudio come from
    # PyPI's default build; to target a specific accelerator reinstall torch from
    # the matching index (CPU: .../whl/cpu, CUDA: .../whl/cu128, AMD: .../whl/rocm6.2).
    "omnivoice",
    "torch",
    "torchaudio",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-tts-plugin-omnivoice"
Repository = "https://github.com/OpenVoiceOS/ovos-tts-plugin-omnivoice"

[project.entry-points."opm.tts"]
ovos-tts-plugin-omnivoice = "ovos_tts_plugin_omnivoice:OmniVoiceTTS"

[project.entry-points."opm.tts.config"]
"ovos-tts-plugin-omnivoice.config" = "ovos_tts_plugin_omnivoice:OmniVoiceTTSPluginConfig"

[tool.setuptools]
packages = ["ovos_tts_plugin_omnivoice"]

[tool.setuptools.dynamic]
version = {attr = "ovos_tts_plugin_omnivoice.version.__version__"}
